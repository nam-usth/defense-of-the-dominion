# Publish the game to GitHub Pages — https://nam-usth.github.io/defense-of-the-dominion/
# — on every push to main (or by hand from the Actions tab). Only what the game
# loads goes online: index.html, css/, js/, assets/models/, assets/ui/, assets/audio/, assets/textures/. The .m3
# sources, tools/ and docs/ stay in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect the game files
        run: |
          mkdir -p _site/assets
          cp -r index.html css js _site/
          cp -r assets/models assets/ui assets/audio assets/textures _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
